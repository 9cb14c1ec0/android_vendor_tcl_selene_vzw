[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 65000
trip_tpcb= 43000
target_tpcb= 45000

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [42000, 44000, 46000, 50000]
hysteresis= [2000, 2000, 2000, 4000]
current= [4000, 3500, 3000, 500]

[flashlight-cooler]
mode= enabled
sensor= ap_ntc
threshold= [43000, 46000, 49000, 53000]
hysteresis= [2000, 2000, 2000, 2000]
limit-state= [1, 2, 3, 5]

[wifi-level-cooler]
mode= enabled
sensor= ap_ntc
threshold= [48000, 51000, 54000, 57000, 60000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
target_level= [1, 2, 3, 4, 5]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [50000, 56000, 58000, 100000]
